name: Feature request
description: Suggest something the crawler should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
    validations:
      required: true

  - type: dropdown
    id: dependencies
    attributes:
      label: Would this need a runtime dependency?
      description: >-
        The project has none on purpose. Proposals that need one are still worth
        discussing, but they need a strong case.
      options:
        - 'No'
        - 'Yes'
        - 'Not sure'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried already
